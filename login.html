<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #172554);
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif
        }

        .login-card {
            width: min(92vw, 420px);
            border: 1px solid #ffffff20;
            border-radius: 24px;
            background: #fff;
            padding: 32px;
            box-shadow: 0 24px 80px #0005
        }

        .logo {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #dbeafe;
            color: #1d4ed8;
            display: grid;
            place-items: center;
            font-size: 27px;
            margin: 0 auto 16px
        }

        .sub {
            color: #64748b
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">🔐</div>
        <h1 class="h3 text-center fw-bold">LOGIN DATABASE</h1>
        <p class="sub text-center mb-4">Sistem Hak Akses Pengguna</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}
        <div class="alert alert-{{ category }} py-2">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="post">
            <div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-lg"
                    name="username" autocomplete="username" required></div>
            <div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg"
                    type="password" name="password" autocomplete="current-password" required></div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
        </form>
        <p class="small text-secondary text-center mt-4 mb-0">Akses hanya untuk pengguna terdaftar</p>
    </main>
</body>

</html>
